<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .form {
            width: 350px;
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        .field {
            margin: 15px 0;
        }

        .box {
            border: 1px solid gray;
            padding: 10px;
            min-height: 18px;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="form">
    <h2>Registration Form</h2>

    <div class="field">
        <label>First Name</label>
        <div class="box" contenteditable="true"></div>
    </div>

    <div class="field">
        <label>Last Name</label>
        <div class="box" contenteditable="true"></div>
    </div>

    <div class="field">
        <label>Email</label>
        <div class="box" contenteditable="true"></div>
    </div>

    <div class="field">
        <label>Password</label>
        <div class="box" contenteditable="true"></div>
    </div>

    <div class="field">
        <label>Address</label>
        <div class="box" contenteditable="true"></div>
    </div>

    <button>Register</button>
</div>

</body>
</html>
